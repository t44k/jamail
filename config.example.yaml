# jamail configuration
# Copy to ~/.config/jamail/config.yaml

# Optional: jamaild/jamail IPC settings. Uncomment to override the socket
# path jamaild listens on and jamail connects to (default:
# $XDG_RUNTIME_DIR/jamail/jamaild.sock, or /tmp/jamail-<uid>/jamaild.sock if
# XDG_RUNTIME_DIR isn't set). The JAMAIL_SOCKET environment variable always
# takes precedence over this when set.
# daemon:
#   socket_path: /run/user/1000/jamail/jamaild.sock
#
#   Optional: bind a real inbound CalDAV (RFC 4791) HTTP server, exposing
#   every account's `caldav`-configured local calendar cache to any CalDAV
#   client (Basic auth against that account's own caldav.login/caldav.auth
#   below). Unset (default): no server at all. See `caldav_server` module
#   docs for exactly what's implemented (one "Default" calendar per
#   account, GET/PUT/DELETE with ETag/If-Match, PROPFIND discovery, and
#   REPORT calendar-query/sync-collection).
#   caldav_server_listen: 127.0.0.1:5232

# Optional: `jacal` (calendar TUI) settings. Unset (default): every field
# below falls back to its own default.
# jacal:
#   # Which day a week starts on in jacal's week/month/year grids.
#   # "monday" (default) or "sunday".
#   week_start: sunday

accounts:
  # Account name (used internally, shown in folder selector)
  personal:
    default: true
    email: alice@example.com
    display_name: Alice Smith
    imap:
      host: imap.example.com
      port: 993
      login: alice@example.com
      auth:
        # type: password — use the value directly
        type: password
        value: my-secret-password
    # Optional: SMTP config for sending email (compose, reply, forward)
    smtp:
      host: smtp.example.com
      port: 587                # 587 for STARTTLS, 465 for implicit TLS
      login: alice@example.com
      auth:
        type: password
        value: my-secret-password
      starttls: true           # true = STARTTLS (port 587), false = implicit TLS (port 465)

  work:
    email: alice@corp.com
    imap:
      host: imap.corp.com
      port: 993
      login: alice@corp.com
      auth:
        # type: command — run a shell command and read password from stdout
        # Works with pass, gpg, secret-tool, 1password-cli, etc.
        type: command
        value: pass show email/work
    smtp:
      host: smtp.corp.com
      port: 587
      login: alice@corp.com
      auth:
        type: command
        value: pass show email/work
      starttls: true
    # Optional: only sync these folders, in this order. This same order is
    # also used for the folder selector (F) — without this, all folders are
    # synced/shown (except Gmail's All Mail/Spam), INBOX first then
    # alphabetical.
    folders:
      - INBOX
      - Sent
      - Drafts
      - Archive
    # Optional: when `folders` is set above, also sync/show remote folders
    # that aren't listed there, appended after the configured ones in
    # deterministic order (INBOX-first, then alphabetical). Has no effect
    # if `folders` is unset. Default: false (only the folders listed above
    # are synced/shown).
    show_unlisted_folders: false
    # Optional: additional "From" identities to cycle through at compose
    # time (Left/Right on the From field). Without this, compose uses a
    # single identity built from display_name/email.
    senders:
      - Alice Smith <alice@corp.com>
      - Alice (Support) <support@corp.com>
    # Optional: upload a copy of sent messages / newly-saved drafts to these
    # IMAP folders. Each is independently optional — unset (the default)
    # means "don't upload"; sent/drafts still work normally, just cached
    # locally only.
    sent_folder: Sent
    draft_folder: Drafts
    # Optional: folders that trigger a desktop notification + unobtrusive
    # sound when new mail arrives (uses notify-send, so it works across
    # Wayland compositors including Hyprland/Omarchy setups; silently does
    # nothing if notify-send/sound player aren't installed). Unset (the
    # default) means no notifications for this account.
    notify_folders:
      - INBOX
    # Optional: CalDAV calendar sync for this account, used by the
    # separate `jacal` calendar TUI (jamaild owns the actual sync loop,
    # same as it owns IMAP — jacal just reads the cache and queues
    # create/update/delete requests, exactly like jamail does for
    # Sent/Draft uploads). Unset (the default) means no calendar sync at
    # all for this account.
    caldav:
      # Any URL under the account's CalDAV root — jacal/jamaild attempt
      # standard discovery (current-user-principal -> calendar-home-set)
      # from here, falling back to treating this URL itself as the home
      # set if the server doesn't support that chain. Point this directly
      # at a calendar collection URL if you already know it.
      url: https://cal.example.com/dav/
      login: alice@corp.com
      auth:
        type: command
        value: pass show cal/work
      # Optional: only sync calendars whose display name is in this list.
      # Unset (the default): sync every discovered calendar.
      calendars:
        - Personal
        - Work
      # Optional: how often (seconds) jamaild polls the server for
      # changes — CalDAV has no IDLE/push equivalent this client
      # implements. Unset (the default): 300 (5 minutes).
      poll_interval_secs: 300
      # Optional: default alarm lead times (minutes before an event's
      # start) for events that carry no VALARM of their own. Unset (the
      # default): no notification unless the event itself has an alarm.
      # Each entry fires its own notification.
      default_alarm_minutes_before: [30, 5]

  # Gmail example
  gmail:
    email: alice@gmail.com
    imap:
      host: imap.gmail.com
      port: 993
      login: alice@gmail.com
      auth:
        # For Gmail, use an App Password (not your account password):
        # https://myaccount.google.com/apppasswords
        type: password
        value: xxxx-xxxx-xxxx-xxxx
    smtp:
      host: smtp.gmail.com
      port: 587
      login: alice@gmail.com
      auth:
        type: password
        value: xxxx-xxxx-xxxx-xxxx
      starttls: true
    folders:
      - INBOX
      - "[Gmail]/Sent Mail"
      - "[Gmail]/Drafts"
      - "[Gmail]/Starred"

# Optional: `jadav`, the standalone self-hosted CalDAV server daemon (a
# separate binary meant for a server host; jamail/jamaild/jacal ignore this
# section). jadav can also run from a file that contains ONLY this section.
# Path resolution for every binary: --config (jadav only), then the
# JAMAIL_CONFIG environment variable, then ~/.config/jamail/config.yaml.
jadav:
  # Plain HTTP; put a TLS-terminating reverse proxy (traefik, nginx) in front.
  listen: 0.0.0.0:5232
  # jadav's own SQLite store (not the mail.db cache).
  store: /var/lib/jadav/jadav.db
  principal:
    # The one login every CalDAV client (phone, jamaild, Thunderbird) uses.
    login: alice@example.com
    auth:
      type: command
      value: pass show jadav/alice
    # Every address that is "me"; the first is the primary. "Name <addr>"
    # is accepted. Unset: just the login, when it is an email address.
    identities:
      - Alice Smith <alice@example.com>
      - alice@corp.com
  # The Google Cloud OAuth client (Desktop-app type) shared by every
  # `kind: google` remote. Authorise each remote once with
  # `jadav google auth <remote>` (or import a refresh token from the
  # previous bridge with `jadav google import-token <remote> <state.json>`).
  google_oauth:
    client_id: 1234567890-abc.apps.googleusercontent.com
    client_secret:
      type: command
      value: pass show jadav/google-client-secret
  # External accounts calendars are mirrored from.
  remotes:
    corp:
      kind: google           # google | caldav
      user: alice@corp.com   # the Google account (also its primary calendar id)
      poll_interval_secs: 120
  calendars:
    # slug = URL path segment: /dav/calendars/<login>/<slug>/
    - slug: personal
      name: Personal
      provider: native       # stored only here
      color: "#3366FF"
      default_for_identity: true   # where invitations for alice@example.com land
    - slug: g-corp
      name: Corp
      identity: alice@corp.com
      provider: google
      remote: corp
      remote_calendar: alice@corp.com
      two_way: true          # false = read-only mirror (clients get 403 on writes)
      send_via: smtp         # who emails invitations/RSVPs: smtp (jadav) | provider
  # Our own mail server, used for iMIP (RFC 6047) in both directions: the
  # inbound watcher reads invitations/replies/cancellations addressed to
  # any identity from these IMAP folders and applies them to the matching
  # calendar; the outbound worker sends our invitations and RSVPs through
  # this SMTP server From: the calendar's identity. Without this block
  # jadav still serves CalDAV and mirrors, but never sends or reads mail.
  mail:
    imap:
      host: mail.example.com
      port: 993
      login: alice@example.com
      auth:
        type: command
        value: pass show jadav/mail
    smtp:
      host: mail.example.com
      port: 587
      login: alice@example.com
      auth:
        type: command
        value: pass show jadav/mail
      starttls: true
    # Folders watched for calendar mail; the first one is IDLE'd on, the
    # rest are re-checked on every wake-up (a filter may move mail between
    # them; every message is applied once, by Message-ID). Mail is never
    # flagged, moved or deleted.
    folders: [INBOX]
    since_days: 14            # how far back the first pass looks
    poll_interval_secs: 60
    # IMAP keywords a mail fetcher stamps on messages it pulled from another
    # mailbox, mapped to the identity that mailbox belongs to. Only used to
    # break a tie when several identities appear on the same invitation.
    keyword_identities:
      acct-corp: alice@corp.com
  scheduling:
    send_via: smtp
    history_days: 90         # how far back a mirror's first fill reaches (0 = all)
    # Properties whose change on an organised event re-sends the invitation
    # (an attendee edit that touches none of these is silent).
    significant_properties: [DTSTART, DTEND, DURATION, RRULE, RDATE, EXDATE, STATUS, SUMMARY, LOCATION]
    # Also drop a copy of invitations for mirrored (Google/CalDAV) calendars
    # into the schedule-inbox that iOS-style clients read. Off: those
    # calendars already receive the invitation through the mirror.
    inbox_for_mirrored: false
    retry_max_age_hours: 24  # give up on an undeliverable iMIP message after this long
    default_timezone: Europe/Budapest   # for subjects of events given in UTC/floating time
  # How long the RFC 6578 change log is kept; older client sync-tokens get a
  # full resync instead of a delta.
  sync_log_retention_days: 90
