[package]
name = "jamail"
version = "0.1.0"
edition = "2024"

[dependencies]
imap = { version = "3.0.0-alpha.15", features = ["native-tls"] }
native-tls = "0.2"
mailparse = "0.16"
ratatui = "0.30"
crossterm = "0.29"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2"
textwrap = "0.16"
anyhow = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
zstd = "0.13"
dirs = "6"
