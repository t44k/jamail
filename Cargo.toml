[package]
name = "jamail"
version = "0.1.0"
edition = "2024"

[lib]
name = "jamail"
path = "src/lib.rs"

[[bin]]
name = "jamail"
path = "src/bin/jamail.rs"

[[bin]]
name = "jamaild"
path = "src/bin/jamaild.rs"

[dependencies]
imap = { version = "3.0.0-alpha.15", features = ["native-tls"] }
imap-proto = "0.16.6"
native-tls = "0.2"
mailparse = "0.16"
ratatui = "0.30"
crossterm = "0.29"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
indexmap = { version = "2", features = ["serde"] }
unicode-width = "0.2"
textwrap = "0.16"
anyhow = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
zstd = "0.13"
dirs = "6"
regex = "1"
image = "0.25"
ratatui-image = { version = "10", default-features = false, features = ["image-defaults", "crossterm"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder"] }
mime_guess = "2"
html2text = "0.16"
serde_json = "1"
base64 = "0.22"
libc = "0.2"
